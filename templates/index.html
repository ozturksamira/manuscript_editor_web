<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Manuscript Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        .control-panel { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;}
        button { background: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .filters { margin: 20px 0; padding: 10px; background: #e9ecef; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background: #e9ecef; }
    </style>
</head>
<body>

    <h1>Advanced Editing Dashboard</h1>

    <div class="control-panel">
        <label><strong>1. Upload a File (.txt, .docx, .pdf)</strong></label>
<p style="font-size: 13px; color: #666; margin-top: 0;"><em>Using Google Docs? Go to File > Download > Microsoft Word (.docx)</em></p>
<input type="file" id="fileInput" name="file" accept=".txt, .docx, application/pdf">

            <label><strong>OR Paste Text</strong></label>
        <label for="textInput"></label><textarea id="textInput" name="text" placeholder="Paste manuscript here..."></textarea>

            <label><strong>2. Custom Words to Flag (comma separated)</strong></label>
        <label for="customWords"></label><input type="text" id="customWords" name="custom_words" placeholder="e.g. smile, nod, sigh">

            <button type="button" onclick="submitAnalysis()">Analyze Manuscript</button>
    </div>

    <div class="filters" id="filterBar" style="display: none;">
        <strong>Filter by Issue: </strong>
        <label><input type="checkbox" checked value="all" onchange="filterTable()"> All</label>
        <label><input type="checkbox" checked value="pacing" onchange="filterTable()"> Pacing</label>
        <label><input type="checkbox" checked value="passive" onchange="filterTable()"> Passive Voice</label>
        <label><input type="checkbox" checked value="frequency" onchange="filterTable()"> Word Frequency</label>
        <label><input type="checkbox" checked value="custom" onchange="filterTable()"> Custom Words</label>
    </div>

    <div id="stats" style="margin-bottom: 20px; font-weight: bold;"></div>

    <table id="resultsTable" style="display: none;">
        <thead><tr><th>Sentence</th><th>Words</th><th>Issues</th></tr></thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <script>
        let currentData = [];

        async function submitAnalysis() {
            const form = document.getElementById('analyzeForm');
            const formData = new FormData(form);
            const statsDiv = document.getElementById('stats');

            statsDiv.innerText = "Analyzing...";

            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

    // Check for server-side errors (like unsupported files)
    if (!response.ok) {
        const errorData = await response.json();
        statsDiv.innerText = errorData.error || "An error occurred during analysis.";
        return;
    }

    const data = await response.json();
    currentData = data.results;

    if (data.flagged_count === 0) {
        statsDiv.innerText = "No issues detected!";
        document.getElementById('resultsTable').style.display = "none";
        document.getElementById('filterBar').style.display = "none";
    } else {
        let topWordsStr = data.top_words.map(w => `${w[0]} (${w[1]})`).join(', ');
        statsDiv.innerHTML = `Found ${data.flagged_count} issues.<br>Top Used Words: ${topWordsStr}`;
        document.getElementById('resultsTable').style.display = "table";
        document.getElementById('filterBar').style.display = "block";
        renderTable();
    }
}

        let response;
        const data = await response.json();
            currentData = data.results;

            if (data.flagged_count === 0) {
                statsDiv.innerText = "No issues detected!";
                document.getElementById('resultsTable').style.display = "none";
                document.getElementById('filterBar').style.display = "none";
            } else {
                let topWordsStr = data.top_words.map(w => `${w[0]} (${w[1]})`).join(', ');
                statsDiv.innerHTML = `Found ${data.flagged_count} issues.<br>Top Used Words: ${topWordsStr}`;
                document.getElementById('resultsTable').style.display = "table";
                document.getElementById('filterBar').style.display = "block";
                renderTable();
        }

        function filterTable() {
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            const checkboxes = document.querySelectorAll('.filters input[type="checkbox"]:not([value="all"]):checked');
            const activeFilters = Array.from(checkboxes).map(cb => cb.value);
            const showAll = document.querySelector('.filters input[value="all"]').checked;

            currentData.forEach(row => {
                // Check if the row has any issue type that matches the active filters
                const matchesFilter = showAll || row.types.some(type => activeFilters.includes(type));

                if (matchesFilter) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row.sentence}</td><td>${row.word_count}</td><td>${row.issues}</td>`;
                    tbody.appendChild(tr);
                }
            });
        }
    </script>
</body>
</html>
