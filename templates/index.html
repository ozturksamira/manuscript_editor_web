<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuscript Analysis Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; line-height: 1.5; color: #333; }
        .control-panel { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; resize: vertical; margin-bottom: 15px;}
        input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;}
        button.btn-primary { background: #0d6efd; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button.btn-primary:hover { background: #0b5ed7; }

        /* Tabs CSS */
        .tab { overflow: hidden; border-bottom: 2px solid #ccc; margin-top: 30px; display: none; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 24px; transition: 0.3s; font-size: 16px; font-weight: bold; color: #555;}
        .tab button:hover { background-color: #e9ecef; }
        .tab button.active { background-color: #0d6efd; color: white; border-radius: 6px 6px 0 0; }
        .tab-content { display: none; padding: 20px 0; border-top: none; }

        /* Table CSS */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; vertical-align: top; }
        th { background: #e9ecef; }

        .toolbar { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        .toolbar input, .toolbar select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .context-list { margin: 0; padding-left: 20px; font-size: 14px; color: #444; }
        .context-list li { margin-bottom: 6px; }
    </style>
</head>
<body>

    <h1>Manuscript Editing Dashboard</h1>

    <div class="control-panel">
        <form id="analyzeForm">
            <label for="fileInput"><strong>1. Upload a File (.txt, .docx, .pdf)</strong></label>
            <input type="file" id="fileInput" name="file" accept=".txt, .docx, application/pdf">

            <label for="textInput"><strong>OR Paste Text</strong></label>
            <textarea id="textInput" name="text" placeholder="Paste a manuscript excerpt here..."></textarea>

            <button type="button" class="btn-primary" onclick="submitAnalysis()">Analyze Manuscript</button>
        </form>
    </div>

    <div id="stats" style="margin-bottom: 10px; font-size: 16px;"></div>

    <!-- Tabs Layout -->
    <div class="tab" id="tabContainer">
      <button class="tab-links active" onclick="openTab(this, 'WordsTab')">Overused & Custom Words</button>
      <button class="tab-links" onclick="openTab(this, 'PassiveTab')">Passive Voice</button>
      <button class="tab-links" onclick="openTab(this, 'PacingTab')">Pacing Issues</button>
    </div>

    <!-- Overused Words Tab -->
    <div id="WordsTab" class="tab-content" style="display:block;">
        <div class="toolbar">
            <input type="text" id="wordSearch" aria-label="Search for a custom word" placeholder="Search for a custom word..." onkeyup="renderWordsTable()" style="flex-grow: 1;">
            <select id="wordSort" aria-label="Sort words" onchange="renderWordsTable()">
                <option value="desc">Sort: Most Used First</option>
                <option value="asc">Sort: Least Used First</option>
                <option value="az">Sort: A-Z</option>
                <option value="za">Sort: Z-A</option>
            </select>
        </div>
        <table id="wordsTable">
            <thead><tr><th style="width: 15%;">Word</th><th style="width: 10%;">Count</th><th style="width: 75%;">Context Locations in Document</th></tr></thead>
            <tbody id="wordsBody"></tbody>
        </table>
    </div>

    <!-- Passive Voice Tab -->
    <div id="PassiveTab" class="tab-content">
        <table>
            <thead><tr><th style="width: 85%;">Sentence</th><th style="width: 15%;">Word Count</th></tr></thead>
            <tbody id="passiveBody"></tbody>
        </table>
    </div>

    <!-- Pacing Tab -->
    <div id="PacingTab" class="tab-content">
        <table>
            <thead><tr><th style="width: 65%;">Sentence</th><th style="width: 15%;">Word Count</th><th style="width: 20%;">Issue Type</th></tr></thead>
            <tbody id="pacingBody"></tbody>
        </table>
    </div>

    <script>
        let wordData = [];
        let passiveData = [];
        let pacingData = [];

        async function submitAnalysis() {
            const form = document.getElementById('analyzeForm');
            const formData = new FormData(form);
            const statsDiv = document.getElementById('stats');

            statsDiv.innerHTML = "<strong>Analyzing...</strong>";
            document.getElementById('tabContainer').style.display = "none";
            document.querySelectorAll('.tab-content').forEach(tc => tc.style.display = "none");

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errorData = await response.json();
                    statsDiv.innerHTML = `<strong style="color: red;">Error: ${errorData.error}</strong>`;
                    return;
                }

                const data = await response.json();
                wordData = data.words || [];
                passiveData = data.passive || [];
                pacingData = data.pacing || [];

                statsDiv.innerHTML = "<strong>Analysis Complete. Navigate tabs below.</strong>";
                document.getElementById('tabContainer').style.display = "block";

                // Show first tab by default
                document.getElementById('WordsTab').style.display = "block";
                document.querySelectorAll('.tab-links')[0].classList.add("active");

                renderWordsTable();
                renderPassiveTable();
                renderPacingTable();

            } catch (error) {
                statsDiv.innerHTML = `<strong style="color: red;">Connection error. Ensure your Flask server is running.</strong>`;
            }
        }

        function renderWordsTable() {
            const tbody = document.getElementById('wordsBody');
            const searchTerm = document.getElementById('wordSearch').value.toLowerCase();
            const sortMethod = document.getElementById('wordSort').value;

            // Filter
            let filtered = wordData.filter(w => w.word.includes(searchTerm));

            // Sort
            filtered.sort((a, b) => {
                if (sortMethod === 'desc') return b.count - a.count;
                if (sortMethod === 'asc') return a.count - b.count;
                if (sortMethod === 'az') return a.word.localeCompare(b.word);
                if (sortMethod === 'za') return b.word.localeCompare(a.word);
            });

            tbody.innerHTML = '';
            filtered.forEach(row => {
                const tr = document.createElement('tr');
                const contextsHtml = row.contexts.map(c => `<li>${c}</li>`).join('');

                tr.innerHTML = `
                    <td><strong>${row.word}</strong></td>
                    <td>${row.count}</td>
                    <td><ul class="context-list">${contextsHtml}</ul></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPassiveTable() {
            const tbody = document.getElementById('passiveBody');
            tbody.innerHTML = '';
            passiveData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.sentence}</td><td>${row.word_count}</td>`;
                tbody.appendChild(tr);
            });
        }

        function renderPacingTable() {
            const tbody = document.getElementById('pacingBody');
            tbody.innerHTML = '';
            pacingData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.sentence}</td><td>${row.word_count}</td><td>${row.issue}</td>`;
                tbody.appendChild(tr);
            });
        }

        function openTab(element, tabName) {
            const tabContent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContent.length; i++) {
                tabContent[i].style.display = "none";
            }

            const tabLinks = document.getElementsByClassName("tab-links");
            for (let i = 0; i < tabLinks.length; i++) {
                tabLinks[i].classList.remove("active");
            }

            document.getElementById(tabName).style.display = "block";
            element.classList.add("active");
        }
    </script>
</body>
</html>
